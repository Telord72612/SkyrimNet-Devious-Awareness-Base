# =============================================================================
#  VRTE DD/ZaZ AddOn — EXTRA RESTRAINTS
#  Teach the SkyrimNet prompts about gear and spells this AddOn does not
#  already know.
# =============================================================================
#
#  WHAT THIS DOES
#  When an NPC is gagged, blindfolded or bound, the AddOn tells the LLM so —
#  a gagged NPC answers in muffled sounds instead of sentences, a bound one
#  stops handing you things, a blindfolded one stops describing what she sees.
#  And when the gear comes off, it tells the LLM that too, for the next three
#  replies, so she does not keep acting restrained out of habit.
#
#  Devious Devices, ZaZ and Diary of Mine gear is ALREADY COVERED. You only
#  need this file for gear from other mods, or for spells.
#
#  This file can only ADD. Nothing you write here can switch off the built-in
#  coverage, so a mistake below costs you the line you got wrong — never the
#  rest of the feature.
#
#  Edited while the game is running? Restrictions are re-read at load, so
#  changes here take effect the next time you launch.
#
# -----------------------------------------------------------------------------
#  THE SIX CATEGORIES
#  Pick by what the gear DOES to the body, not by what it is called.
#
#    [gag]     speech is blocked        - she can only make muffled sounds
#    [blind]   sight is blocked         - she cannot see anything at all
#    [arms]    arms or hands unusable   - cannot hold, take, give, or fight
#    [legs]    walking cut to a shuffle - cannot run, cannot keep pace
#    [all]     cannot act at all        - shown INSTEAD of [arms] and [legs]
#    [deaf]    hearing dulled or gone   - she answers tone and volume, not words
#              (ships commented out near the bottom - nothing needs it by default)
#
#  A piece of gear may appear in several categories. A hood that covers the
#  eyes and the mouth belongs in BOTH [gag] and [blind].
#
# -----------------------------------------------------------------------------
#  THE THREE KINDS OF LINE
#
#    name    = Ball Gag
#        Matches any WORN ITEM or SPELL whose name CONTAINS this text.
#        Not case-sensitive. "gag" would match "Ball Gag" and "Gagged Hood".
#        Keep it specific enough not to catch things you did not mean:
#        "ring" would also match "Ring of Namira".
#
#    form    = 0x012345~SomeMod.esp
#        One exact record. Works for an ARMOR, a SPELL, or a MAGIC EFFECT —
#        so a blindness spell goes here just as easily as a blindfold.
#        The ~PluginName.esp part is REQUIRED: a bare FormID cannot be
#        resolved safely and is rejected with a line in the log.
#        Get the id from xEdit, or in game with `help "item name" 4`.
#        Leading zeroes and the load-order byte are both fine — only the last
#        six digits are used.
#
#    keyword = zbfWornGag
#        Any worn keyword's EditorID. Use this when a whole mod tags its gear
#        consistently: one line covers every piece.
#
#  `spell = ...` is accepted as a synonym for `form` if it reads better to you.
#
# -----------------------------------------------------------------------------
#  DID IT WORK?
#  Look in  Documents\My Games\Skyrim VR\SKSE\VRTE_DDZaZ.log  after a launch:
#
#    [RESTRAINT] VRTE_DDZaZ_Restraints.ini: 4 rule(s) loaded, 0 rejected
#                | gag=2 blind=1 arms=1 legs=0 all=0
#
#  Every rejected line says why, by name — an unknown section, a form that did
#  not resolve, a key that is not one of the three above.
# =============================================================================


[gag]
# Speech blocked. Built in already: every DD gag (ball, panel, bit, ring, tape,
# inflatable), ZaZ's zbfWornGag, Diary of Mine's DOMWornGag.
#
# 2026-08-29 (report 29 §0.6m), the user's Other-tab review: Devious Lore's
# execution / cloth / leather hoods SEAL THE MOUTH but carry no gag keyword —
# "hood for prisoner to be executed, blindness, deafness and gag". Blind and
# deaf already come from their own zad_DeviousBlindfold / zad_DeviousHood
# keywords; only the gag half needs a line here.
# ⚠ Safe as substrings: DD's own rendered halves are NAMELESS (0 of 1221 carry
#   a FULL record), so these cannot over-match DD's hoods.
name = Execution Hood
name = Cloth Hood
name = Leather Hood
#
# Examples — delete the # to use one:
# name = Muzzle
# form = 0x0800AB~MyBondageMod.esp
# keyword = MYMOD_WornGag


[blind]
# Sight blocked. Built in already: DD blindfolds and hoods, ZaZ blindfolds.
#
# ⚠ Some hoods and helmets cover the eyes as well as the mouth. Those belong in
#   BOTH [blind] and [gag] — the two blocks are independent and both will show.
#
# Examples:
# name = Blinding
# form = 0x0012F3~MyMagicMod.esp     ; a blindness SPELL works here too


[arms]
# Arms or hands unusable — cannot hold, take, give, draw a weapon or fight.
# Built in already: DD armbinders, yokes, straitjackets, elbow ties, bondage
# mittens, bondage gloves, and wrist cuffs that lock the hands TOGETHER.
#
# ⚠ Plain decorative wrist cuffs are deliberately NOT built in. In DD they are
#   worn like bracelets and restrict nothing; treating them as bondage would
#   silently cripple a large share of the NPCs wearing them. If YOUR cuffs do
#   bind, add them here.
#
# Examples:
# name = Manacles
# keyword = MYMOD_ArmsBound


[legs]
# Walking cut to a shuffle. Built in already: DD hobble skirts, ankle shackles,
# pony gear, ballet boots.
#
# Examples:
# name = Leg Irons
# form = 0x0300AA~MyBondageMod.esp


[all]
# Cannot act at all. This is shown INSTEAD of [arms] and [legs], so use it for
# gear that takes everything rather than listing the piece three times.
# Built in already: DD straitjackets and pet suits.
#
# Examples:
# name = Cocoon
# form = 0x0040FF~MyMagicMod.esp     ; e.g. a paralysis effect

; -------------------------------------------------------------------------
; [deaf] - HEARING dulled or blocked.                        (added 2026-08-27)
;
; Built in: zad_DeviousHood only. That is not an oversight - there is NO
; hearing keyword anywhere in Devious Devices or ZaZ, verified by scanning
; every keyword on every device in this load order. A hood is the only thing
; that covers the ears, and 134 records carry it.
;
; A blindfold is deliberately NOT here: it covers the eyes and leaves the
; ears open. Use [blind] for that.
;
; Add earplugs, a helm, or a deafness SPELL here and the NPC is told sound is
; muffled - she still receives speech, but is instructed to treat it as
; indistinct rather than to act on the words.
;
; [deaf]
; name    = Earplugs
; keyword = MyMod_WornEarplugs
; spell   = 0x001234~MyDeafnessSpell.esp
; -------------------------------------------------------------------------
