; ==============================================================================
;  VRTE DD/ZaZ AddOn - SCALES
;  Every timer and every chance in the device model, in one file.
;
;  The values below ARE the shipped model. Editing nothing changes nothing.
;  Delete the file entirely and the mod uses these same numbers from code.
;
;  ---- HOW TO READ IT --------------------------------------------------------
;  A device builds an EFFECT over time. How far it climbs is its PHASE, 1 to 5.
;  Phase 1 is silent. The phase boundaries are shared by every device; each TIER
;  scales them by its own multiplier, so a cuff and an armbinder ride the same
;  curve at different speeds.
;
;  Times are GAME HOURS unless a section says otherwise.
;
;  ---- SYNTAX ----------------------------------------------------------------
;  key = number.  Keys are LETTERS ONLY - no digits, no underscores. That is why
;  the phase keys read "first/second/third/fourth" and the gag tiers "gagopen"
;  and "gagfill". A line the parser cannot read is IGNORED and SAID SO in
;  VRTE_DDZaZ.log - if a change seems to do nothing, read the log first.
;  Every value is range-checked; one outside its range is refused, logged, and
;  the default kept.
; ==============================================================================


; ------------------------------------------------------------------ [pace] ---
;  ONE DIAL OVER THE WHOLE MODEL. This is the setting most people want.
;    0.5 = everything happens twice as FAST   (harsher, grimmer)
;    2.0 = everything takes twice as LONG     (gentler, slower burn)
;  It multiplies the per-tier speeds below, so the SHAPE of the ladder is kept:
;  a cuff still stops early and a yoke still outruns an armbinder.
[pace]
global = 1.0


; ----------------------------------------------------------------- [phase] ---
;  The shared boundaries, in game hours, for phases 2 / 3 / 4 / 5.
;  A tier's multiplier stretches these; a tier at 1.0 uses them as written.
[phase]
first  = 1.0
second = 3.0
third  = 6.0
fourth = 12.0


; ------------------------------------------------------------ [multiplier] ---
;  How fast each tier climbs. HIGHER = SLOWER.
;  strap 6.0 means a cuff takes six times as long as an armbinder to reach the
;  same phase. clamp 0.08 means nipple clamps run in MINUTES, not hours - that
;  is deliberate and physiological, not a typo.
[multiplier]
arms       = 1.0
limb       = 1.5
strap      = 6.0
yoke       = 1.25
rope       = 2.0
suit       = 1.0
gagopen    = 0.5
gagfill    = 0.5
clamp      = 0.08
mitt       = 1.0
damp       = 2.0
dampsealed = 1.0


; --------------------------------------------------------------- [ceiling] ---
;  How far each tier is allowed to climb, 1 to 5.
;
;  !! RAISING A CEILING IS NOT "HARSHER" AND LOWERING ONE IS NOT "GENTLER". !!
;  Phase 5 is nerve block, and it is the QUIETEST line in the model - the body
;  reports LESS while the harm is greatest. Capping a tier at 4 therefore pins
;  it at the PEAK of complaint forever and removes the only quiet ending it had.
;  If you want a device to be milder, slow it down in [multiplier] instead.
;
;  strap 2 is deliberate: an ordinary cuff or collar chafes and stops there. It
;  never claims nerve damage, however long it is worn.
[ceiling]
arms       = 5
limb       = 5
strap      = 2
yoke       = 4
rope       = 4
suit       = 5
gagopen    = 4
gagfill    = 4
clamp      = 5
mitt       = 5
damp       = 4
dampsealed = 5
; per-class overrides, applied on top of the tier ceiling
boots      = 3
heels      = 2


; -------------------------------------------------------------- [cooldown] ---
;  REAL SECONDS, not game hours. These pace how often a thing may happen.
[cooldown]
cast      = 45.0     ; between magicka-reactive triggers on one actor
shock     = 90.0     ; between shock discharges on one actor
claim     = 3.5      ; window in which a hand gesture owns the equip it caused (3.5 = PPB's equip check, build 20106)
menuclaim = 10.0     ; window after a container menu closes, for attribution
trip      = 30.0     ; after a blind NPC falls, before another fall is possible
mistarget = 12.0     ; after a blind NPC switches target, before switching again


; ---------------------------------------------------------------- [chance] ---
;  PERCENT, 0 to 100.
[chance]
castplug       = 15  ; per worn plug, that a spell cast triggers the device
castpiercing   = 5   ; per worn piercing, same
shockperdevice = 6   ; multiplied by the number of shocking devices worn
tripwalking    = 5   ; a blind NPC stumbling while walking, per 3s
triprunning    = 25  ; ... while running
tripstairs     = 50  ; ... on a slope or stairs
mistarget      = 25  ; a blind NPC in combat swinging at the nearest body, per 3s


; --------------------------------------------------------------- [arousal] ---
;  How much arousal a device adds when a spell she casts sets it off.
;
;  PER DEVICE AND CUMULATIVE, by SITE. Every qualifying device she is wearing
;  adds its own number, so:
;      all four worn        1 + 2 + 3 + 3  =  +9
;      the two piercings    1 + 3          =  +4
;      one anal plug                       =  +2
;
;  This applies in ALL THREE situations - in combat, in public and alone.
;  (Before 2026-09-06 arousal moved only when she was alone in a private
;  place, because it was a side effect of the animation that only played
;  there. A device did something to her body; where she was standing did not
;  change that.)
;
;  ⚠ When she IS alone and unwatched, Devious Devices' own vibration effect
;  runs as well and adds its own arousal on top of these. That is intended:
;  that is the full-expression case and it should be the largest gain.
;
;  A bare "Plug" device with no site keyword takes the anal value, because
;  guessing the higher one would inflate every unclassified plug.
[arousal]
nipple   = 1
anal     = 2
clitoris = 3
vaginal  = 3


; ------------------------------------------------------------- [aftermath] ---
;  What a device leaves behind AFTER it comes off. GAME HOURS.
;
;  A device builds strain while worn; these decide how long the body keeps
;  reporting it once the device is gone. The phase reached at removal picks
;  which one applies.
;
;  !! ONLY [reperfusion] IS ANCHORED TO A SOURCE. A released ischemic block
;  returns over minutes - that is measured. The other four are an argued SHAPE:
;  ordered, roughly doubling, defensible - NOT a measurement. They are here so
;  you can disagree with them without a rebuild.
;
;  Note phase 5 runs in two parts. Phase 5 is nerve block, the QUIETEST state
;  while worn, so removal is the loudest moment in the whole model: feeling
;  floods back (reperfusion), and only then does the lasting weakness show
;  (deficit). Wear climbs in how much is reported; aftermath climbs in harm.
[aftermath]
;  ★ 2026-09-10: the after-state is a PROMPT BLOCK now, not an event. It lasts three
;  prompts - the full line, then easing, then fading - counted by the conversations
;  she is part of. The hours below are its LONGEST life: if nobody talks to her in
;  the meantime, it has run out by then. Phase 5 opens on the reperfusion line and
;  moves on to the deficit line; its life is reperfusion + deficit.
marks       = 1.0    ; phase 2  a pressed mark and tenderness
ache        = 2.0    ; phase 3  congestion clearing, ache and stiffness
deep        = 4.0    ; phase 4  deep joint ache, range still short
reperfusion = 0.5    ; phase 5a feeling flooding back    [ANCHORED]
deficit     = 6.0    ; phase 5b weakness, clumsiness, numb patches

;  How fast the strain itself winds down once a device is off. Put the same kind
;  of device back on inside this window and it RESUMES partway up its curve
;  instead of starting from zero - an evening's collar taken off and refastened
;  is not a fresh neck. Per TIER, not per device.
decay       = 1.0

;  Cuffs and collars mark the skin and nothing more, and only after a long
;  stretch. Below this many hours worn they leave nothing at all. Set low and
;  every NPC who wore a collar for an evening reports a mark; that is the spam
;  this threshold exists to prevent.
strapthreshold = 24.0
