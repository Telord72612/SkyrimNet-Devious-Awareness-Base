; ═══════════════════════════════════════════════════════════════════════════
;  VRTE_DDZaZ_ClothingGate.ini — the FOUR-LAYER equip model (2026-08-29)
;
;  The DLL classifies every device into one of four layers by its DD class /
;  ZaZ site keywords, then this file RECLASSIFIES by device-name substring —
;  the user's word beats the defaults, no rebuild needed.
;
;  ⚠ WHAT THE LAYER ACTUALLY DOES, IN TWO PARTS:
;
;    1. AWARENESS (always, every platform). The layer decides how a device is
;       described and whether an onlooker is told about it at all. A plug
;       under a belt is not described to the room. This is the reason the
;       model exists and it restricts nothing.
;
;    2. THE VR HAND GESTURE (only there). Precision Physic Bodies asks this
;       same model before letting you press a device onto a body BY HAND, so
;       you cannot push under-layer gear through heavy armour with your palm.
;       The "install rule" wording below describes THAT check and nothing
;       else.
;
;  ⛔ EQUIPPING BY MENU, CONTAINER, SCRIPT, QUEST OR CONSOLE IS NEVER
;     RESTRICTED BY THIS FILE. Editing it cannot stop — or allow — any of
;     those. It changes the description, and the VR gesture.
;
;  THE LAYERS (the wording below is the VR-gesture install rule):
;    [internal]  plugs — the orifice must be open and the pelvis free of
;                clothes AND devices (a belt or sealed suit blocks, honouring
;                DD's own zad_Permit* exceptions)
;    [under]     worn against skin, clothes may go over them LATER — suits,
;                piercings, harnesses, chastity belts, blindfolds, tight
;                hoods, smaller gags. Install needs the location bare of
;                clothes/armor.
;    [mid]       replaces clothing — corsets, boots, mittens, pet suits, the
;                binder family, posture collars. Same install rule as under.
;    [outer]     goes over anything, armor included — yokes, prisoner cuffs
;                and shackles, ordinary collars. On the ARM and LEG regions
;                only HEAVY armor blocks; light armor and clothes never do.
;
;  Matching is case-insensitive SUBSTRING against the device's display name.
;  When a name matches several sections the most permissive wins (outer
;  first). One line per needle:  name = <substring>
; ═══════════════════════════════════════════════════════════════════════════

